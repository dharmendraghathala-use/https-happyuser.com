<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HappyUser</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
.header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.balance{
  margin:18px;
  padding:22px;
  border-radius:15px;
  background:white;
  text-align:center;
  box-shadow:0 3px 12px #0001;
}
.balance small{color:#777}
.balance h1{margin-top:8px;color:#16a34a}
.container{padding:0 18px 25px}
.card{
  background:white;
  padding:18px;
  margin-top:15px;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}
.card h2{font-size:19px;margin-bottom:14px}
input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-bottom:10px;
  font-size:16px;
}
button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  color:white;
  background:#2563eb;
  font-size:16px;
  font-weight:bold;
}
.withdraw{background:#dc2626}
.upi{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:12px;
  border-radius:9px;
  margin-bottom:12px;
  word-break:break-all;
}
#status{
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}
.history{
  margin-top:10px;
  font-size:14px;
}
.history div{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.credit{color:#16a34a}
.debit{color:#dc2626}
</style>
</head>

<body>

<div class="header">HappyUser</div>

<div class="balance">
  <small>Available Balance</small>
  <h1>₹<span id="balance">0.00</span></h1>
</div>

<div class="container">

  <div class="card">
    <h2>Add Money</h2>

    <div class="upi">
      <b>UPI ID:</b><br>
      9351881703-1@fam
    </div>

    <input
      type="number"
      id="addAmount"
      placeholder="Enter amount"
      min="1"
    >

    <button onclick="addMoney()">
      Add Money
    </button>

    <div id="paymentStatus"></div>
  </div>

  <div class="card">
    <h2>Withdrawal</h2>

    <input
      type="number"
      id="withdrawAmount"
      placeholder="Enter withdrawal amount"
      min="1"
    >

    <input
      type="text"
      id="withdrawUpi"
      placeholder="Enter withdrawal UPI ID"
    >

    <button class="withdraw" onclick="withdrawMoney()">
      Withdraw
    </button>
  </div>

  <div class="card">
    <h2>Transaction History</h2>
    <div id="history" class="history">
      <div>No transactions yet</div>
    </div>
  </div>

</div>

<script>
let balance = Number(localStorage.getItem("happyuser_balance")) || 0;
let transactions =
  JSON.parse(localStorage.getItem("happyuser_transactions")) || [];

function updateBalance(){
  document.getElementById("balance").textContent =
    balance.toFixed(2);

  localStorage.setItem(
    "happyuser_balance",
    balance.toFixed(2)
  );
}

function saveTransactions(){
  localStorage.setItem(
    "happyuser_transactions",
    JSON.stringify(transactions)
  );
}

function showHistory(){
  const box = document.getElementById("history");

  if(transactions.length === 0){
    box.innerHTML = "<div>No transactions yet</div>";
    return;
  }

  box.innerHTML = transactions
    .slice()
    .reverse()
    .map(t => `
      <div>
        <span>
          ${t.type}<br>
          <small>${t.date}</small>
        </span>
        <b class="${t.amount > 0 ? "credit" : "debit"}">
          ${t.amount > 0 ? "+" : ""}₹${Math.abs(t.amount).toFixed(2)}
        </b>
      </div>
    `)
    .join("");
}

function addMoney(){
  const amount =
    Number(document.getElementById("addAmount").value);

  if(!amount || amount <= 0){
    alert("Enter a valid amount");
    return;
  }

  /*
    IMPORTANT:
    Real UPI payment confirmation must come from
    a verified payment gateway/backend.

    This demo button does NOT verify an actual UPI payment.
    It only demonstrates the balance/transaction UI.
  */

  document.getElementById("paymentStatus").innerHTML =
    "UPI payment ke baad verified gateway confirmation par balance credit karein.";

  document.getElementById("addAmount").value = "";
}

function creditVerifiedPayment(amount, transactionId){
  amount = Number(amount);

  if(!amount || amount <= 0 || !transactionId){
    return;
  }

  balance += amount;

  transactions.push({
    type:"Add Money",
    amount:amount,
    transactionId:transactionId,
    date:new Date().toLocaleString()
  });

  saveTransactions();
  updateBalance();
  showHistory();
}

function withdrawMoney(){
  const amount =
    Number(document.getElementById("withdrawAmount").value);

  const upi =
    document.getElementById("withdrawUpi").value.trim();

  if(!amount || amount <= 0){
    alert("Enter a valid withdrawal amount");
    return;
  }

  if(!upi){
    alert("Enter withdrawal UPI ID");
    return;
  }

  if(amount > balance){
    alert("Insufficient balance");
    return;
  }

  balance -= amount;

  transactions.push({
    type:"Withdrawal",
    amount:-amount,
    upi:upi,
    date:new Date().toLocaleString()
  });

  saveTransactions();
  updateBalance();
  showHistory();

  document.getElementById("withdrawAmount").value = "";
  document.getElementById("withdrawUpi").value = "";

  alert("Withdrawal request submitted");
}

updateBalance();
showHistory();
</script>

</body>
</html>
