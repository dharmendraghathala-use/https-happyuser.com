<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAPPYUSER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#08040d;
    color:white;
}

.app{
    width:390px;
    max-width:100%;
    min-height:100vh;
    margin:auto;
    background:linear-gradient(180deg,#19052b,#351052,#a942b6);
    position:relative;
    padding-bottom:70px;
}

/* Header */
.header{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

/* Banner */
.banner{
    margin:10px 14px;
    height:120px;
    border-radius:12px;
    padding:18px;
    background:linear-gradient(135deg,#71169a,#210638);
    border:1px solid #963dc0;
}

.banner h1{
    font-size:24px;
    margin-bottom:8px;
}

.banner p{
    font-size:11px;
    color:#ddd;
    line-height:18px;
}

/* Section */
.section-title{
    margin:18px 14px 8px;
    font-size:13px;
    font-weight:bold;
}

/* Cards */
.cards{
    padding:0 14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.card{
    height:120px;
    border-radius:8px;
    padding:6px;
    background:linear-gradient(145deg,#47116a,#170822);
    border:1px solid #733092;
    cursor:pointer;
}

.card-image{
    height:78px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    font-weight:bold;
    background:linear-gradient(135deg,#f04b30,#74149b);
}

.card:nth-child(2) .card-image{
    background:linear-gradient(135deg,#164f77,#d53d82);
}

.card:nth-child(3) .card-image{
    background:linear-gradient(135deg,#24733e,#71175f);
}

.card:nth-child(4) .card-image{
    background:linear-gradient(135deg,#812d9d,#111d42);
}

.card:nth-child(5) .card-image{
    background:linear-gradient(135deg,#bd472d,#42105d);
}

.card:nth-child(6) .card-image{
    background:linear-gradient(135deg,#1d6972,#7d1d9d);
}

.card-name{
    font-size:8px;
    margin-top:6px;
    color:#ddd;
}

/* Bottom Navigation */
.bottom-nav{
    position:fixed;
    bottom:0;
    width:390px;
    max-width:100%;
    height:65px;
    background:#100719;
    border-top:1px solid #642078;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    width:25%;
    text-align:center;
    font-size:9px;
    color:#bca9c5;
    cursor:pointer;
}

.nav-item.active{
    color:white;
}

.icon{
    display:block;
    font-size:20px;
    margin-bottom:4px;
}

/* Profile */
.profile{
    padding:15px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:#5b1770;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:10px auto;
    font-size:25px;
    font-weight:bold;
}

.profile-name{
    text-align:center;
    font-size:12px;
    margin-bottom:15px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu button{
    height:38px;
    border:none;
    border-radius:7px;
    color:white;
    text-align:left;
    padding:0 14px;
    background:linear-gradient(90deg,#410c61,#260732);
    border:1px solid #6d2489;
    cursor:pointer;
}

.menu button span{
    float:right;
}

/* Empty */
.empty{
    text-align:center;
    margin-top:180px;
    font-size:12px;
    color:#ddd;
}

.empty-circle{
    width:40px;
    height:40px;
    border:2px solid white;
    border-radius:50%;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Privacy */
.privacy{
    padding:15px;
    font-size:11px;
    line-height:18px;
}

.privacy h2{
    font-size:15px;
    margin-bottom:10px;
}

.back{
    padding:10px 15px;
    cursor:pointer;
    font-size:12px;
}
</style>
</head>

<body>

<div class="app">

    <div id="content"></div>

    <div class="bottom-nav">

        <div class="nav-item active" onclick="showHome(this)">
            <span class="icon">⌂</span>
            Home
        </div>

        <div class="nav-item" onclick="showHistory(this)">
            <span class="icon">▣</span>
            History
        </div>

        <div class="nav-item" onclick="showProfile(this)">
            <span class="icon">♙</span>
            Profile
        </div>

        <div class="nav-item" onclick="showMore(this)">
            <span class="icon">⋮</span>
            More
        </div>

    </div>

</div>


<script>

const content = document.getElementById("content");


function setActive(element){

    document.querySelectorAll(".nav-item")
    .forEach(item => item.classList.remove("active"));

    element.classList.add("active");
}


/* HOME */

function showHome(element){

    if(element) setActive(element);

    content.innerHTML = `

        <div class="header">
            HAPPYUSER
        </div>

        <div class="banner">

            <h1>HAPPYUSER</h1>

            <p>NEW PLAYERS PROGRAM</p>

            <p>
                Join tournaments • Win rewards •
                Play with friends
            </p>

        </div>

        <div class="section-title">
            E-Sports
        </div>

        <div class="cards">

            ${createCard("FREE FIRE","BOOYAH")}
            ${createCard("BATTLE","ARENA")}
            ${createCard("FREE FIRE","CLASH")}
            ${createCard("SURVIVAL","BATTLE")}
            ${createCard("HAPPYUSER","RUSH")}
            ${createCard("CLASH","MATCH")}

        </div>
    `;
}


/* CARD */

function createCard(title,subtitle){

    return `

        <div class="card"
             onclick="alert('${title} selected')">

            <div class="card-image">

                ${title}<br>
                ${subtitle}

            </div>

            <div class="card-name">
                TOURNAMENT
            </div>

        </div>

    `;
}


/* HISTORY */

function showHistory(element){

    setActive(element);

    content.innerHTML = `

        <div class="header">
            Winner History
        </div>

        <div class="empty">

            <div class="empty-circle">
                ✓
            </div>

            No history

        </div>

    `;

}


/* PROFILE */

function showProfile(element){

    setActive(element);

    content.innerHTML = `

        <div class="header">
            Profile
        </div>

        <div class="profile">

            <div class="avatar">
                H
            </div>

            <div class="profile-name">
                HappyUser
            </div>

            <div class="menu">

                <button>
                    My Profile
                    <span>›</span>
                </button>

                <button>
                    Change Password
                    <span>›</span>
                </button>

                <button>
                    Wallet
                    <span>›</span>
                </button>

                <button>
                    My Wallet History
                    <span>›</span>
                </button>

                <button>
                    Top Players
                    <span>›</span>
                </button>

                <button>
                    Scratch Cards
                    <span>›</span>
                </button>

                <button>
                    My Challenges
                    <span>›</span>
                </button>

                <button>
                    Feedback
                    <span>›</span>
                </button>

                <button>
                    About Us
                    <span>›</span>
                </button>

                <button>
                    Terms & Conditions
                    <span>›</span>
                </button>

                <button onclick="showPrivacy()">
                    Privacy Policy
                    <span>›</span>
                </button>

                <button>
                    FAQs
                    <span>›</span>
                </button>

                <button>
                    Customer Support
                    <span>›</span>
                </button>

                <button>
                    Share App
                    <span>›</span>
                </button>

                <button>
                    Logout
                    <span>›</span>
                </button>

            </div>

        </div>
    `;
}


/* MORE */

function showMore(element){

    setActive(element);

    content.innerHTML = `

        <div class="header">
            More
        </div>

        <div class="profile">

            <div class="menu">

                <button onclick="showPrivacy()">
                    Privacy Policy
                    <span>›</span>
                </button>

                <button>
                    Terms & Conditions
                    <span>›</span>
                </button>

                <button>
                    Customer Support
                    <span>›</span>
                </button>

                <button>
                    Share App
                    <span>›</span>
                </button>

            </div>

        </div>

    `;
}


/* PRIVACY POLICY */

function showPrivacy(){

    content.innerHTML = `

        <div class="header">
            Privacy Policy
        </div>

        <div class="back" onclick="showProfile()">
            ‹ Back
        </div>

        <div class="privacy">

            <h2>
                Privacy Policy
            </h2>

            <p>
                We care about the privacy and security
                of your information.
            </p>

            <br>

            <p>
                This policy explains how HappyUser
                collects, uses and protects information
                when you use the application.
            </p>

            <br>

            <p>
                We may collect account details,
                gameplay information, device information
                and information that you provide while
                using our services.
            </p>

            <br>

            <p>
                Your information may be used to provide
                services, improve your experience,
                prevent misuse and communicate important
                updates.
            </p>

            <br>

            <p>
                We do not sell your personal information.
                Information may be shared only when
                required to provide a service or comply
                with applicable law.
            </p>

        </div>
    `;
}


/* FIRST SCREEN */

showHome(
    document.querySelector(".nav-item")
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAPPYUSER</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#08040d;
    color:white;
}

.app{
    width:390px;
    max-width:100%;
    min-height:100vh;
    margin:auto;
    background:
    linear-gradient(
        180deg,
        #170329 0%,
        #25063b 35%,
        #b84fbd 100%
    );
    min-height:100vh;
    position:relative;
    padding-bottom:80px;
}

/* ================= HEADER ================= */

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
    position:relative;
}

.back-btn{
    position:absolute;
    left:18px;
    top:18px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid #67537b;
    background:#171032;
    color:white;
    font-size:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.coin{
    position:absolute;
    right:10px;
    top:20px;
    height:40px;
    min-width:82px;
    padding:0 10px;
    border-radius:25px;
    background:#253071;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:18px;
    font-weight:bold;
}

.coin-icon{
    width:29px;
    height:29px;
    border-radius:50%;
    background:#f2df6c;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:17px;
}

/* ================= TABS ================= */

.tabs{
    margin:18px 18px 70px;
    height:70px;
    border-radius:40px;
    padding:5px;
    background:#211a4c;
    border:2px solid #5c4c7b;
    box-shadow:0 0 25px #713a86;
    display:flex;
}

.tab{
    width:33.33%;
    border:0;
    background:transparent;
    color:white;
    font-size:18px;
    border-radius:35px;
    cursor:pointer;
}

.tab.active{
    background:linear-gradient(
        90deg,
        #6821a3,
        #8b29bd
    );
}

/* ================= TOURNAMENT LIST ================= */

.tournament-list{
    padding:0 14px;
}

/* ================= CARD ================= */

.match-card{
    background:#f4f3fa;
    color:#292533;
    border-radius:14px;
    margin-bottom:28px;
    padding:28px 14px 18px;
    box-shadow:0 5px 15px rgba(0,0,0,.35);
}

/* card top */

.match-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.game-logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:
    linear-gradient(135deg,#f4bd57,#8d3797);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    font-size:8px;
    font-weight:bold;
    border:2px solid #e7c56c;
}

.match-title{
    flex:1;
}

.match-title h2{
    font-size:20px;
    line-height:24px;
}

.match-title p{
    text-align:center;
    font-size:14px;
    font-weight:bold;
    margin-top:3px;
}

.view{
    color:#222;
    font-size:18px;
    text-decoration:underline;
    cursor:pointer;
}

/* ================= INFO BOXES ================= */

.info-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin-top:22px;
}

.info-box{
    height:47px;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        #9e42c7,
        #8533a7
    );
    color:#f3eafa;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:bold;
    text-align:center;
}

.info-value{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    text-align:center;
    margin-top:4px;
    font-size:20px;
    font-weight:bold;
}

.info-value div:first-child{
    color:#f1b72f;
}

.info-value div:nth-child(2),
.info-value div:nth-child(3){
    color:#333;
}

/* ================= TYPE ================= */

.type-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin-top:15px;
}

.type-box{
    height:48px;
    border-radius:12px;
    background:#9439b7;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:bold;
}

.type-value{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-top:8px;
}

/* ================= BOTTOM JOIN ================= */

.join-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:25px;
}

.progress{
    flex:1;
    height:43px;
    border-radius:9px;
    background:#b982e3;
    border:2px solid #28105b;
    overflow:hidden;
    position:relative;
}

.progress-fill{
    height:100%;
    background:#5a1b9b;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-weight:bold;
}

.join-btn{
    width:98px;
    height:43px;
    border:0;
    border-radius:25px;
    background:linear-gradient(
        90deg,
        #5669a1,
        #18295d
    );
    color:white;
    font-size:17px;
    cursor:pointer;
}

.join-btn:active{
    transform:scale(.96);
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding-top:100px;
    color:#ddd;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

/* ================= DETAILS ================= */

.details{
    padding:20px;
}

.details-box{
    background:#f4f3fa;
    color:#222;
    border-radius:15px;
    padding:20px;
}

.details-box h2{
    color:#6b2094;
    margin-bottom:20px;
}

.detail-item{
    padding:14px;
    margin-bottom:8px;
    background:#eadbf1;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}

.confirm-btn{
    width:100%;
    height:48px;
    margin-top:15px;
    border:0;
    border-radius:25px;
    background:#7927a8;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= FLOATING BUTTON ================= */

.floating{
    position:fixed;
    right:18px;
    bottom:75px;
    width:65px;
    height:65px;
    border-radius:50%;
    background:
    radial-gradient(circle,#d94b30,#31072f);
    border:3px solid #7f42c7;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    box-shadow:0 5px 15px #1b0027;
    cursor:pointer;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    width:390px;
    max-width:100%;
    height:65px;
    background:#0b0610;
    border-top:1px solid #52215f;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
}

.nav-item{
    width:25%;
    text-align:center;
    font-size:10px;
    color:#aaa;
    cursor:pointer;
}

.nav-item.active{
    color:white;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

/* ================= PROFILE ================= */

.profile{
    padding:20px;
}

.avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    background:white;
    color:#6e238f;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    margin:10px auto;
}

.profile-name{
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    height:43px;
    border:1px solid #70258d;
    border-radius:8px;
    background:linear-gradient(
        90deg,
        #410c61,
        #260732
    );
    color:white;
    text-align:left;
    padding:0 15px;
    cursor:pointer;
}

.menu button span{
    float:right;
}

/* ================= BACK ================= */

.back{
    padding:5px 20px 15px;
    cursor:pointer;
    font-size:15px;
}

/* ================= MOBILE ================= */

@media(max-width:390px){

    .app{
        width:100%;
    }

    .bottom-nav{
        width:100%;
    }

    .match-title h2{
        font-size:17px;
    }

    .info-box{
        font-size:13px;
    }

}

</style>
</head>

const matches = [

},

},

{

},

{

    prize:"500",
    kill:"8",
    fee:"10",
    players:"20/48",
    percent:42
}

];

const content =
document.getElementById("content");


/* ================= ACTIVE NAV ================= */

function setActive(element){

    document
    .querySelectorAll(".nav-item")
    .forEach(item =>
        item.classList.remove("active")
    );

    if(element){
        element.classList.add("active");
    }
}


/* ================= HEADER ================= */

function header(){

return `

<div class="header">

    <button class="back-btn"
            onclick="showHome()">
        ←
    </button>

    FREE FIRE MAX

    <div class="coin">

        <div class="coin-icon">
            👑
        </div>

        10

    </div>

</div>

`;

}


/* ================= HOME ================= */

function showHome(element){

    if(element){
        setActive(element);
    }

    content.innerHTML = `

        ${header()}

        <div class="tabs">

            <button class="tab"
                    onclick="changeTab(this,'ongoing')">
                Ongoing
            </button>

            <button class="tab active"
                    onclick="changeTab(this,'upcoming')">
                Upcoming
            </button>

            <button class="tab"
                    onclick="changeTab(this,'result')">
                Result
            </button>

        </div>

        <div id="matchList"
             class="tournament-list">

        </div>

    `;

    showMatches("upcoming");
}


/* ================= TABS ================= */

function changeTab(button,type){

    document
    .querySelectorAll(".tab")
    .forEach(tab =>
        tab.classList.remove("active")
    );

    button.classList.add("active");

    showMatches(type);
}


/* ================= MATCH LIST ================= */

function showMatches(type){

    const list =
    document.getElementById("matchList");

    if(type === "result"){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🏆
                </div>

                No result available

            </div>

        `;

        return;
    }

    if(type === "ongoing"){

        list.innerHTML =
        matches.slice(0,2)
        .map(match =>
            createMatch(match,true)
        )
        .join("");

        return;
    }

    list.innerHTML =
    matches
    .map(match =>
        createMatch(match,false)
    )
    .join("");
}
