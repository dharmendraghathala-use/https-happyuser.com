<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>HappyUser</title>

<style>
:root{
    --bg1:#170025;
    --bg2:#4a1769;
    --bg3:#cf4fca;
    --purple:#8d32bd;
    --purple2:#6e1da1;
    --line:#a53bd0;
    --text:#fff;
    --muted:#d7c8df;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#08000d;
    color:white;
}

button{
    font:inherit;
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    max-width:720px;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(
        180deg,
        var(--bg1) 0%,
        #2d0a43 45%,
        #bf4ac0 100%
    );
}

/* ================= SCREEN ================= */

.screen{
    width:100%;
    height:100%;
    overflow-y:auto;
    padding-bottom:85px;
    display:none;
}

.screen.active{
    display:block;
}

::-webkit-scrollbar{
    width:0;
}

/* ================= TOP BAR ================= */

.topbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 18px;

    position:sticky;
    top:0;
    z-index:10;

    background:rgba(16,0,26,.72);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:25px;
    font-weight:800;
}

.center-title{
    font-size:26px;
    font-weight:800;
}

.iconbtn{
    width:46px;
    height:46px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.35);

    background:rgba(255,255,255,.08);

    color:white;

    font-size:25px;
}

.coin{
    background:#21105c;

    border:3px solid #531bb0;

    border-radius:24px;

    padding:7px 12px;

    font-size:18px;
}

/* ================= HERO ================= */

.hero{
    padding:18px;
}

.hero h1{
    font-size:32px;
    margin-bottom:8px;
}

.hero p{
    color:#ddd0e2;
}

/* ================= BANNER ================= */

.banner{
    margin:10px 18px 18px;

    padding:18px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #7822a7,
        #c33cc2
    );

    box-shadow:
    0 12px 30px rgba(0,0,0,.22);
}

.banner h2{
    font-size:23px;
}

.banner p{
    margin-top:6px;
    color:#f4e8f7;
}

/* ================= SECTION ================= */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 18px;

    font-size:20px;
    font-weight:700;
}

/* ================= GAMES ================= */

.game-grid{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

    padding:0 18px;
}

.game{
    min-height:110px;

    border-radius:17px;

    padding:15px;

    background:
    linear-gradient(
        135deg,
        #531178,
        #8d2bb5
    );

    border:1px solid #b34bd1;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    color:white;

    box-shadow:
    0 8px 20px rgba(0,0,0,.16);
}

.game .emoji{
    font-size:36px;
    margin-bottom:auto;
}

.game b{
    font-size:18px;
}

/* ================= MATCH ================= */

.match{
    margin:14px 18px;

    background:white;
    color:#111;

    border-radius:17px;

    padding:16px;

    box-shadow:
    0 10px 28px rgba(0,0,0,.25);
}

.match h3{
    text-align:center;

    font-size:18px;

    line-height:1.25;
}

.match .date{
    text-align:center;

    font-size:13px;

    font-weight:700;

    margin:7px 0 12px;
}

/* ================= STATS ================= */

.stats{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:7px;
}

.stat .label{
    background:
    linear-gradient(
        90deg,
        #9136ba,
        #7830ad
    );

    color:#e7dbea;

    border-radius:12px;

    padding:10px 5px;

    text-align:center;

    font-weight:700;

    font-size:13px;
}

.stat .value{
    text-align:center;

    padding:8px 2px;

    font-size:18px;

    font-weight:800;
}

/* ================= TABS ================= */

.tabs{
    margin:14px 18px;

    background:#171434;

    border-radius:35px;

    padding:4px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    border:3px solid rgba(255,255,255,.16);

    box-shadow:
    0 0 20px rgba(199,90,255,.22);
}

.tab{
    padding:12px 5px;

    border-radius:28px;

    background:transparent;

    color:white;
}

.tab.active{
    background:
    linear-gradient(
        90deg,
        #7223a4,
        #8e2cbd
    );
}

/* ================= PROFILE ================= */

.profile-head{
    text-align:center;

    padding:28px 18px 20px;
}

.profile-head h1{
    font-size:32px;
}

.avatar{
    width:120px;
    height:120px;

    margin:25px auto 14px;

    border-radius:50%;

    background:white;

    color:#7b299f;

    display:grid;
    place-items:center;

    font-size:52px;
    font-weight:700;
}

.profile-head h2{
    font-size:20px;
}

/* ================= MENU ================= */

.menu-list{
    padding:0 38px;
}

.menu-item{
    width:100%;

    margin:7px 0;

    padding:20px 28px;

    border-radius:15px;

    border:1px solid #8d2eb4;

    background:
    linear-gradient(
        90deg,
        #2b0a42,
        #180020
    );

    color:white;

    text-align:left;

    font-size:19px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.menu-item:hover{
    background:#46105e;
}

/* ================= CARD ================= */

.card{
    margin:18px;

    padding:20px;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.18);
}

/* ================= INPUT ================= */

.field{
    margin:12px 0;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#ddd;
}

.field input{
    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #9340b9;

    background:#16001f;

    color:white;

    outline:none;
}

/* ================= BUTTON ================= */

.primary{
    width:100%;

    padding:14px;

    border-radius:12px;

    background:
    linear-gradient(
        90deg,
        #8429b0,
        #b23dc3
    );

    color:white;

    font-weight:700;

    margin-top:8px;
}

/* ================= BOTTOM NAV ================= */

.bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:76px;

    background:#0d0711;

    border-top:
    1px solid rgba(255,255,255,.12);

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    z-index:30;
}

.nav{
    background:transparent;

    color:#aaa;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    font-size:12px;
}

.nav .ico{
    font-size:24px;
}

.nav.active{
    color:white;
}

/* ================= FLOAT BUTTON ================= */

.fab{
    position:absolute;

    right:28px;
    bottom:94px;

    width:68px;
    height:68px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #d454b8,
        #5c0b82
    );

    border:3px solid #8d43d2;

    box-shadow:
    0 8px 20px rgba(0,0,0,.35);

    color:white;

    font-size:28px;

    z-index:25;
}

/* ================= MODAL ================= */

.modal{
    position:absolute;

    inset:0;

    background:rgba(0,0,0,.62);

    z-index:50;

    display:none;

    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;

    background:#160020;

    border-radius:
    22px 22px 0 0;

    padding:22px;

    border-top:
    1px solid #9a39bd;
}

.sheet h2{
    margin-bottom:15px;
}

.sheet button{
    width:100%;

    padding:15px;

    margin:6px 0;

    border-radius:12px;

    background:#2d0a40;

    color:white;

    text-align:left;
}

/* ================= TOAST ================= */

.toast{
    position:absolute;

    left:50%;
    bottom:90px;

    transform:translateX(-50%);

    background:white;

    color:#17001f;

    padding:12px 18px;

    border-radius:22px;

    display:none;

    z-index:80;

    white-space:nowrap;

    font-weight:700;
}

.toast.show{
    display:block;
}

.small{
    font-size:13px;
    color:#cbbbd2;
}

@media(min-width:721px){

    .app{
        border-left:1px solid #30103d;
        border-right:1px solid #30103d;
    }

}
</style>
</head>

let name =

let walletCoins =

/* =====================================================
                       SHORT $
===================================================== */

function $(id){

    return document.getElementById(id);

}


/* =====================================================
                    CHANGE SCREEN
===================================================== */

function showScreen(id){

    document
    .querySelectorAll('.screen')
    .forEach(
        screen =>
        screen.classList.remove('active')
    );


    $(id)
    .classList
    .add('active');


    document
    .querySelectorAll('.nav')
    .forEach(nav => {

        nav.classList.toggle(
            'active',
            nav.dataset.screen === id
        );

    });


    if(id === 'home'){

        renderHome();

    }


    if(id === 'history'){

        renderHistory();

    }


    window.scrollTo(0,0);

}
