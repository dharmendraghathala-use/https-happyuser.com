<!doctype html>
<html lang="en"
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HappyUser</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#19002b;
 --bg2:#32005a;
 --card:#fff;
 --purple:#7d19c7;
 --purple2:#9d29dc;
 --pink:#d74fd0;
 --muted:#cfc1d8;
 --dark:#110018;
}

html,body{
 height:100%;
 font-family:Arial,sans-serif;
 background:#09000d;
 color:#fff
}

button,input{
 font:inherit
}

button{
 border:0
}

.app{
 height:100dvh;
 max-width:720px;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:linear-gradient(
   180deg,
   #170021,
   #330058 58%,
   #ce49c5
 )
}

.screen{
 position:absolute;
 inset:0;
 display:none;
 overflow-y:auto;
 padding-bottom:78px
}

.screen.active{
 display:block
}

.top{
 height:66px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 16px;
 background:rgba(18,0,30,.58);
 backdrop-filter:blur(12px);
 position:sticky;
 top:0;
 z-index:10
}

.title{
 font-weight:800;
 font-size:20px
}

.back{
 width:38px;
 height:38px;
 border-radius:50%;
 background:transparent;
 color:#fff;
 border:1px solid #8f67a3;
 font-size:25px
}

.balance{
 background:#251342;
 border:1px solid #a26bd1;
 border-radius:20px;
 padding:7px 10px;
 font-weight:700;
 font-size:13px
}
</style>
</head>

<body>

<div class="app">

<section id="splash" class="screen active" style="padding:0">

<div class="splash">
 <div>
  <div class="splash-logo">
   HAPPY
  </div>

  <h1>HappyUser</h1>
  <p>Play • Win • Enjoy</p>
 </div>
</div>

</section>
